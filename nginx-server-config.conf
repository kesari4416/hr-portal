# =============================================
# HR Portal - Nginx Configuration for Production
# File: /etc/nginx/sites-available/hr-portal
# Server: 3.7.71.195 (AWS)
# =============================================

server {
    listen 80;
    server_name 3.7.71.195;

    # Frontend (React build files)
    root /var/www/html/hr-frontend/build;
    index index.html;

    # Max upload size for avatar photos
    client_max_body_size 5M;

    # Frontend routes - React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - proxy to FastAPI on port 8008
    location /api/ {
        proxy_pass http://127.0.0.1:8008/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded files (employee avatars)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8008/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
