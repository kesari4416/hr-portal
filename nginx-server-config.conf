# =============================================
# HR Portal - Nginx Configuration
# File: /etc/nginx/sites-available/hr-portal
# Server: api.sparkcurv.com
# =============================================

server {
    listen 80;
    server_name api.sparkcurv.com;

    # Frontend (React build files)
    root /var/www/hr-portal/frontend/build;
    index index.html;

    # Frontend routes - React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - proxy to FastAPI on port 8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
